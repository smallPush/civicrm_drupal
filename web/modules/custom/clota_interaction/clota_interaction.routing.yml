clota_interaction.room_reservation:
  path: '/reserva-sala'
  defaults:
    _form: '\Drupal\clota_interaction\Form\RoomReservationForm'
    _title: 'Reserva de la sala'
  requirements:
    _permission: 'reserve clota room'

clota_interaction.profile:
  path: '/perfil-clota'
  defaults:
    _form: '\Drupal\clota_interaction\Form\ClotaProfileForm'
    _title: 'El meu perfil'
  requirements:
    _permission: 'edit own clota profile'

clota_interaction.directory:
  path: '/directori-clota'
  defaults:
    _controller: '\Drupal\clota_interaction\Controller\ClotaDirectoryController::build'
    _title: 'Directori de La Clota'
  requirements:
    _permission: 'view clota directory'

clota_interaction.agenda:
  path: '/agenda'
  defaults:
    _controller: '\Drupal\clota_interaction\Controller\ClotaAgendaController::build'
    _title: 'Agenda de La Clota'
    period: 'upcoming'
  requirements:
    _access: 'TRUE'

clota_interaction.agenda_history:
  path: '/agenda/historic'
  defaults:
    _controller: '\Drupal\clota_interaction\Controller\ClotaAgendaController::build'
    _title: 'Històric de La Clota'
    period: 'past'
  requirements:
    _access: 'TRUE'
