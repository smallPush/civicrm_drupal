services:
  web:
    build: .
    restart: always
    ports:
      - "${HOST_PORT:-8080}:80"
    expose:
      - "80"
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - CIVICRM_DB_HOST=${CIVICRM_DB_HOST:-${DB_HOST:-db}}
      - CIVICRM_DB_PORT=${CIVICRM_DB_PORT:-${DB_PORT:-3306}}
      - CIVICRM_DB_USER=${CIVICRM_DB_USER:-${DB_USER}}
      - CIVICRM_DB_PASSWORD=${CIVICRM_DB_PASSWORD:-${DB_PASSWORD}}
      - CIVICRM_DB_NAME=${CIVICRM_DB_NAME:-${DB_NAME}}
      - DRUPAL_HASH_SALT=${DRUPAL_HASH_SALT}
    volumes:
      - drupal_data:/var/www/html/web/sites/default/files
    networks:
      - default
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su=mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  drupal_data:
  db_data:

networks:
  dokploy-network:
    external: true
