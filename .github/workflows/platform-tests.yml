name: Platform tests

on:
  push:
    branches:
      - develop
      - production
    tags:
      - "v*-drupal*-civicrm*"
  pull_request:
    branches:
      - develop
      - production

permissions:
  contents: read

concurrency:
  group: develop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Validate and build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release versions
        run: composer test:versions

      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: php scripts/release-version.php --check-tag "${GITHUB_REF_NAME}"

      - name: Run Docker tests
        run: composer test:docker
